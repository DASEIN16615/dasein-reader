name: Build Dasein Reader Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-cargo

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Setup vendors (pdfjs)
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NEXT_PUBLIC_APP_PLATFORM: tauri
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          pnpm tauri android build --debug -t aarch64

      - name: Find and Stage APK
        run: |
          mkdir -p staging
          find apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} staging/ \;
          ls -la staging/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DaseinReader-Android-arm64
          path: staging/*.apk
          retention-days: 30
